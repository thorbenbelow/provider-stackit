apiVersion: iaas.stackit.kubee.dev/v1alpha1
kind: ServerBackupSchedule
metadata:
  annotations:
    meta.upbound.io/example-id: iaas/v1alpha1/serverbackupschedule
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    backupProperties:
      name: example_backup_name
      retentionPeriod: 14
      volumeIds: null
    enabled: true
    name: example_backup_schedule_name
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rrule: DTSTART;TZID=Europe/Sofia:20200803T023000 RRULE:FREQ=DAILY;INTERVAL=1
    serverIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
