apiVersion: iaas.stackit.kubee.dev/v1alpha1
kind: NetworkAreaRegion
metadata:
  annotations:
    meta.upbound.io/example-id: iaas/v1alpha1/networkarearegion
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    ipv4:
      networkRanges:
      - prefix: 10.0.0.0/16
      transferNetwork: 10.1.2.0/24
    networkAreaIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    organizationId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
