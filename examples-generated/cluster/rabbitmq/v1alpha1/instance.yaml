apiVersion: rabbitmq.stackit.kubee.dev/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rabbitmq/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example-instance
    parameters:
      consumerTimeout: 18000000
      enableMonitoring: false
