apiVersion: logs.stackit.kubee.dev/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: logs/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: logs
  name: logs
spec:
  forProvider:
    displayName: logs-instance-example
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: eu01
    retentionDays: 30
