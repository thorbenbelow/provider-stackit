apiVersion: vpc.stackit.kubee.dev/v1alpha1
kind: RoutingTable
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routingtable
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    labels:
      key: value
    name: example
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: vpc.stackit.kubee.dev/v1alpha1
kind: Region
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routingtable
  labels:
    testing.upbound.io/example-name: example-region
  name: example-region
spec:
  forProvider:
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
