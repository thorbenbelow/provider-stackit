apiVersion: authorization.stackit.kubee.dev/v1alpha1
kind: ServiceAccountRoleAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/serviceaccountroleassignment
  labels:
    testing.upbound.io/example-name: sa
  name: sa
spec:
  forProvider:
    resourceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: iam
    role: user
    subject: ${data.stackit_service_accounts.ske_sa_suffix.items.0.email}

---

apiVersion: authorization.stackit.kubee.dev/v1alpha1
kind: ProjectRoleAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/serviceaccountroleassignment
  labels:
    testing.upbound.io/example-name: pr_sa
  name: pr-sa
spec:
  forProvider:
    resourceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    role: kms.admin
    subject: ${stackit_service_account.iam.email}

---

apiVersion: serviceaccount.stackit.kubee.dev/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/serviceaccountroleassignment
  labels:
    testing.upbound.io/example-name: iam
  name: iam
spec:
  forProvider:
    name: kms
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
