apiVersion: edgecloud.stackit.kubee.dev/v1alpha1
kind: Token
metadata:
  annotations:
    meta.upbound.io/example-id: edgecloud/v1alpha1/token
  labels:
    testing.upbound.io/example-name: by_name
  name: by-name
spec:
  forProvider:
    expiration: 3600
    instanceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: edgecloud.stackit.kubee.dev/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: edgecloud/v1alpha1/token
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    description: some_description
    displayName: example
    planId: ${var.plan_id}
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
