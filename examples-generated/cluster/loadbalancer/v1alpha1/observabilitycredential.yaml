apiVersion: loadbalancer.stackit.kubee.dev/v1alpha1
kind: ObservabilityCredential
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/observabilitycredential
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    displayName: example-credentials
    password: example-password
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    username: example-user
