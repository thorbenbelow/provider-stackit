apiVersion: edgecloud.stackit.m.kubee.dev/v1alpha1
kind: Kubeconfig
metadata:
  annotations:
    meta.upbound.io/example-id: edgecloud/v1alpha1/kubeconfig
  labels:
    testing.upbound.io/example-name: by_name
  name: by-name
  namespace: crossplane-system
spec:
  forProvider:
    expiration: 3600
    instanceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: edgecloud.stackit.m.kubee.dev/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: edgecloud/v1alpha1/kubeconfig
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: crossplane-system
spec:
  forProvider:
    description: some_description
    displayName: example
    planId: ${var.plan_id}
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
