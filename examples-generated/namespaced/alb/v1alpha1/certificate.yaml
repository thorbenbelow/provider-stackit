apiVersion: alb.stackit.m.kubee.dev/v1alpha1
kind: Certificate
metadata:
  annotations:
    meta.upbound.io/example-id: alb/v1alpha1/certificate
  labels:
    testing.upbound.io/example-name: certificate
  name: certificate
  namespace: crossplane-system
spec:
  forProvider:
    name: example-certificate
    privateKeySecretRef:
      key: attribute.private_key_pem
      name: example-private-key
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    publicKey: ${tls_self_signed_cert.example.cert_pem}
