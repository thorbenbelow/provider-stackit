apiVersion: authorization.stackit.m.kubee.dev/v1alpha1
kind: ProjectCustomRole
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/projectcustomrole
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    description: Some description
    name: my.custom.role
    permissions:
    - iam.subject.get
    resourceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: resourcemanager.stackit.m.kubee.dev/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/projectcustomrole
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: example_project
    ownerEmail: foo.bar@stackit.cloud
    parentContainerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
