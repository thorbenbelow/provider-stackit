apiVersion: authorization.stackit.m.kubee.dev/v1alpha1
kind: ProjectRoleAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/projectroleassignment
  labels:
    testing.upbound.io/example-name: pra
  name: pra
  namespace: crossplane-system
spec:
  forProvider:
    resourceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    role: reader
    subject: foo.bar@stackit.cloud

---

apiVersion: resourcemanager.stackit.m.kubee.dev/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: authorization/v1alpha1/projectroleassignment
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: example_project
    ownerEmail: foo.bar@stackit.cloud
    parentContainerId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
