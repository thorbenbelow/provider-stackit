apiVersion: postgresflex.stackit.m.kubee.dev/v1alpha1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: postgresflex/v1alpha1/database
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: mydb
    owner: myusername
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
