apiVersion: iaas.stackit.m.kubee.dev/v1alpha1
kind: ServerVolumeAttach
metadata:
  annotations:
    meta.upbound.io/example-id: iaas/v1alpha1/servervolumeattach
  labels:
    testing.upbound.io/example-name: attached_volume
  name: attached-volume
  namespace: crossplane-system
spec:
  forProvider:
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
