apiVersion: iaas.stackit.m.kubee.dev/v1alpha1
kind: Server
metadata:
  annotations:
    meta.upbound.io/example-id: iaas/v1alpha1/server
  labels:
    testing.upbound.io/example-name: user-data-from-file
  name: user-data-from-file
  namespace: crossplane-system
spec:
  forProvider:
    bootVolume:
      size: 64
      sourceId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      sourceType: image
    keypairNameSelector:
      matchLabels:
        testing.upbound.io/example-name: keypair
    machineType: g2i.1
    name: example-server
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    userData: ${file("${path.module}/cloud-init.yaml")}

---

apiVersion: iaas.stackit.m.kubee.dev/v1alpha1
kind: KeyPair
metadata:
  annotations:
    meta.upbound.io/example-id: iaas/v1alpha1/server
  labels:
    testing.upbound.io/example-name: keypair
  name: keypair
  namespace: crossplane-system
spec:
  forProvider:
    name: example-key-pair
    publicKey: ${chomp(file("path/to/id_rsa.pub"))}
