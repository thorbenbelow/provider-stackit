apiVersion: modelserving.stackit.m.kubee.dev/v1alpha1
kind: Token
metadata:
  annotations:
    meta.upbound.io/example-id: modelserving/v1alpha1/token
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: Example token
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rotateWhenChanged:
      rotation: ${time_rotating.rotate.id}
